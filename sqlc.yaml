version: "2"
sql:
  - engine: postgresql
    schema: db/wallet/migrations
    queries: db/wallet/queries
    gen:
      go:
        package: walletdb
        out: internal/wallet/walletdb
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_enum_valid_method: true
        initialisms: [id, fx]
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          # Trace context columns come out as OpenTelemetry's own carrier.
          - column: "*.trace_context"
            go_type: go.opentelemetry.io/otel/propagation.MapCarrier
          # Exchange rates come out as exact decimals.
          - column: "fx_quotes.rate"
            go_type: github.com/fiston-user/payments/internal/fx.Rate
